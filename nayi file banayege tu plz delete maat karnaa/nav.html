<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aviral</title>
</head>
<body>
    <nav class="navbar">
  <div class="logo">MyProject</div>

  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>

  <button class="menu-btn">☰</button>
</nav>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
  }

  .navbar {
    height: 65px;
    padding: 0 8%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111827;
    color: white;
  }

  .logo {
    font-size: 22px;
    font-weight: bold;
  }

  .nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
  }

  .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
  }

  .nav-links a:hover {
    color: #60a5fa;
  }

  .menu-btn {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 25px;
  }

  @media (max-width: 600px) {
    .nav-links {
      display: none;
    }

    .menu-btn {
      display: block;
    }
  }
</style>
</body>
</html>
